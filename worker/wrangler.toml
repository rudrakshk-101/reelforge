name = "reelforge-bridge"
main = "worker.js"
compatibility_date = "2024-11-01"

# Secrets are NOT set here. After `npm create cloudflare` / installing wrangler:
#   wrangler secret put BOT_TOKEN
#   wrangler secret put CHAT_ID
#   wrangler secret put TG_SECRET
#   wrangler secret put GH_OWNER
#   wrangler secret put GH_REPO
#   wrangler secret put GH_PAT
# then:
#   wrangler deploy
# then point Telegram at it:
#   curl "https://api.telegram.org/bot<BOT_TOKEN>/setWebhook?url=https://reelforge-bridge.<subdomain>.workers.dev&secret_token=<TG_SECRET>"
