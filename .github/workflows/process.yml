name: process

on:
  repository_dispatch:
    types: [process]
  workflow_dispatch:
    inputs:
      url:
        description: "YouTube URL to clip"
        required: true

concurrency:
  group: reelforge
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: System deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install reelforge
        run: pip install -e .

      - name: Materialise secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
          VIDKRAKEN_KEY: ${{ secrets.VIDKRAKEN_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          mkdir -p secrets
          printf '%s' "$YOUTUBE_CLIENT_SECRET" > secrets/youtube_client_secret.json
          printf '%s' "$YOUTUBE_TOKEN" > secrets/youtube_token.json
          {
            echo "GEMINI_API_KEY=$GEMINI_API_KEY"
            echo "TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN"
            echo "TELEGRAM_CHAT_ID=$TELEGRAM_CHAT_ID"
            echo "YOUTUBE_CLIENT_SECRETS_FILE=secrets/youtube_client_secret.json"
            echo "YOUTUBE_TOKEN_FILE=secrets/youtube_token.json"
            echo "VIDKRAKEN_KEY=$VIDKRAKEN_KEY"
            echo "IG_USER_ID=$IG_USER_ID"
            echo "IG_ACCESS_TOKEN=$IG_ACCESS_TOKEN"
          } > .env

      - name: Process
        run: |
          reelforge-cloud process --url "${{ github.event.client_payload.url || github.event.inputs.url }}"
