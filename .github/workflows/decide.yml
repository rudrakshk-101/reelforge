name: decide

on:
  repository_dispatch:
    types: [approve, reject]

concurrency:
  group: reelforge
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install reelforge
        run: pip install -e .

      - name: Materialise secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
        run: |
          mkdir -p secrets
          printf '%s' "$YOUTUBE_CLIENT_SECRET" > secrets/youtube_client_secret.json
          printf '%s' "$YOUTUBE_TOKEN" > secrets/youtube_token.json
          {
            echo "GEMINI_API_KEY=$GEMINI_API_KEY"
            echo "TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN"
            echo "TELEGRAM_CHAT_ID=$TELEGRAM_CHAT_ID"
            echo "YOUTUBE_CLIENT_SECRETS_FILE=secrets/youtube_client_secret.json"
            echo "YOUTUBE_TOKEN_FILE=secrets/youtube_token.json"
          } > .env

      - name: Decide
        run: |
          reelforge-cloud decide \
            --action "${{ github.event.action }}" \
            --video-id "${{ github.event.client_payload.video_id }}" \
            --chat "${{ github.event.client_payload.chat_id }}" \
            --message "${{ github.event.client_payload.message_id }}"

      - name: Persist state
        if: always()
        run: |
          git config user.name "reelforge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f reelforge.db 2>/dev/null || true
          git diff --cached --quiet || git commit -m "state: decide [skip ci]"
          git pull --rebase --autostash origin main || true
          git push || true
